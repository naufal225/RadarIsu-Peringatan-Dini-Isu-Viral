# RadarIsu — one command: `docker compose up -d` (PRD §16).
# Copy .env.example to .env and fill the required values first.
#
# Only the frontend (Next.js BFF) is published. Laravel is reachable from the BFF only,
# and trusts X-Forwarded-For only from the BFF's fixed address (PRD v2.1 §13).

name: radarisu

x-backend: &backend
  build: ./backend
  image: radarisu-backend
  restart: unless-stopped
  environment: &backend-env
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?set APP_KEY in .env}
    APP_URL: ${APP_URL:-http://localhost:3000}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-radarisu}
    DB_USERNAME: ${DB_USERNAME:-radarisu}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    SESSION_DRIVER: array
    SANCTUM_EXPIRATION: "480"
    TRUSTED_PROXIES: ${BFF_IP:-172.28.0.10}
    DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?set DEMO_USER_PASSWORD in .env}
  volumes:
    - backend-storage:/var/www/html/storage/app
  networks:
    - radarisu
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-radarisu}
      POSTGRES_USER: ${DB_USERNAME:-radarisu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - radarisu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *backend
    # Migrations run once on the php-fpm container; seed manually: `docker compose exec app php artisan db:seed`.
    command: ["sh", "-c", "php artisan migrate --force && php artisan config:cache && exec php-fpm"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan migrate:status > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - radarisu
    depends_on:
      app:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      LARAVEL_URL: http://nginx
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      radarisu:
        ipv4_address: ${BFF_IP:-172.28.0.10}
    depends_on:
      - nginx

networks:
  radarisu:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.28.0.0/24}

volumes:
  postgres-data:
  backend-storage:

# Laravel API behind php-fpm. Not published to the host: only the Next.js BFF talks to it.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    client_max_body_size 12m; # CSV import limit is 10 MB (PRD §11).

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        # REMOTE_ADDR is the BFF container; Laravel trusts its X-Forwarded-For (TRUSTED_PROXIES).
        fastcgi_param REMOTE_ADDR $remote_addr;
    }

    location ~ /\. {
        deny all;
    }
}
